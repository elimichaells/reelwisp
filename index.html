<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cliffhanger Cinema</title>
  <meta name="description" content="Animated story series where every episode ends on a cliffhanger.">
  <style>
    :root { --bg: #0d0f14; --fg: #f2f2f2; --muted: #9aa0ab; --accent: #e5383b; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; padding: 24px 16px; }
    main { max-width: 560px; text-align: center; }
    h1 { font-size: clamp(2rem, 7vw, 3.2rem); margin: 0 0 12px; letter-spacing: -0.02em; }
    h1 span { color: var(--accent); }
    p { color: var(--muted); line-height: 1.6; margin: 0 0 12px; }
    .now { color: var(--fg); }
    footer { margin-top: 40px; font-size: 0.9rem; }
    a { color: var(--fg); }
  </style>
</head>
<body>
  <main>
    <h1>Cliffhanger <span>Cinema</span></h1>
    <p>Animated story series where every episode ends on a cliffhanger. Horror, mystery, action: one episode at a time.</p>
    <p class="now">Now showing: <strong>Night Shift Rules</strong></p>
    <footer><a href="privacy.html">Privacy policy</a></footer>
  </main>
</body>
</html>
